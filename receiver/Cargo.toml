[package]
name = "vmtransfer"
version = "0.1.0"
edition = "2021"
description = "Visual file-transfer receiver with offline and optional Portal/PipeWire capture"
license = "MIT"

[features]
default = []
live-capture = ["dep:zbus", "dep:futures-lite", "dep:async-channel"]

[dependencies]
png = "=0.18.1"
sha2 = "=0.10.9"
crc32fast = "=1.5.0"
rustix = { version = "=1.1.4", features = ["fs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
zbus = { version = "=5.19.0", optional = true }
futures-lite = { version = "=2.6.1", optional = true }
async-channel = { version = "=2.5.0", optional = true }

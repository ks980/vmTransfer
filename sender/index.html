<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VMT1 视觉文件传输</title><link rel="stylesheet" href="ui/style.css"></head>
<body><main><h1>视觉文件传输</h1>
<p class="intro">选择一个文件，准备完成后开始播放。请保持页面前台；接收成功后手动停止。</p>
<div class="controls"><label>文件 <input id="file" type="file"></label><button id="cancel" disabled>取消准备</button></div>
<div class="controls"><button id="start" disabled>开始播放</button><button id="pause" disabled>暂停</button><button id="stop" disabled>停止</button>
<label>目标帧率 <select id="rate"><option value="5">5 FPS</option><option value="10">10 FPS</option><option value="15">15 FPS</option>
<option value="20">20 FPS</option><option value="25">25 FPS</option><option value="30">30 FPS</option></select></label>
<label>数据矩阵 <select id="matrix"><option value="128">128×128</option><option value="160">160×160</option><option value="256">256×256</option></select></label>
<label>每符号像素 <input id="scale" type="number" min="1" max="16" step="1" value="4"></label></div>
<p id="file-info"></p>
<p id="status" role="status" aria-live="polite">尚未选择文件</p>
<p id="progress">尚未播放</p><p id="timing">本地绘制频率不代表 VNC 接收频率。</p>
<p id="visibility-notice" class="notice" hidden>页面位于后台，浏览器可能降低播放频率。请保持发送页面在前台。</p>
<details><summary>SHA-256</summary><code id="hash"></code></details>
<p class="hint">矩阵大小可在准备文件前或停止后选择；更改会重新准备文件，请新建接收会话。请让完整白色边框和三个黑白标记保持可见；画面放不下时，调小每符号像素或放大窗口。</p>
<canvas id="canvas" width="640" height="640" aria-label="编码图像"></canvas>
</main><script src="vendor/sha256.js"></script><script src="protocol/codec.js"></script>
<script src="render/canvas.js"></script><script src="session/transfer.js"></script><script src="player/player.js"></script>
<script src="ui/app.js"></script></body></html>
